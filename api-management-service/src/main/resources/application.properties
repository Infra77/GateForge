spring.application.name=api-management-service

#server config
server.port=8081

#service info
info.service.name=API Management Service
info.service.description=Management Service for Users, Routes and Gateway policies

#security config
security.jwt.expiry=${JWT_EXPIRY}
security.jwt.secret=${SECRET_KEY}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

